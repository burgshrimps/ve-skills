<svg xmlns="http://www.w3.org/2000/svg" viewBox="82 58 1000 434" width="1000" height="434" role="img" aria-label="ve-skills workflow: segregation, frequency and routing feed four effect branches which converge into a merge step">
  <rect x="82" y="58" width="1000" height="434" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">

    <!-- wires, drawn at icon height so they never cross the captions -->
    <g fill="none" stroke="#BBB5AA" stroke-width="1.3" stroke-linecap="round">
      <path d="M188 248 C 236 246, 282 250, 328 248"/>
      <path d="M378 248 C 424 250, 468 246, 514 248"/>
      <path d="M570 248 C 636 248, 660 96, 742 96"/>
      <path d="M570 248 C 636 248, 660 204, 742 204"/>
      <path d="M570 248 C 636 248, 660 312, 742 312"/>
      <path d="M570 248 C 636 248, 660 420, 742 420"/>
      <path d="M798 96 C 880 96, 902 252, 960 252"/>
      <path d="M798 204 C 880 204, 902 252, 960 252"/>
      <path d="M798 312 C 880 312, 902 252, 960 252"/>
      <path d="M798 420 C 880 420, 902 252, 960 252"/>
    </g>

    <!-- ve-segregation : pedigree -->
    <g transform="translate(162,248)" fill="none" stroke="#1C453E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-19 -19 L-6 -19.5 L-5.5 -7 L-18.5 -6.5 Z"/>
      <path d="M13 -13 C 19.5 -13, 19.5 -3.5, 13 -3.5 C 6.5 -3.5, 6.5 -13, 13 -13 Z"/>
      <path d="M-12 -6 L-12 3 L13 3.5 L13 -3"/>
      <path d="M0.5 3.2 L0 12"/>
      <circle cx="0" cy="17" r="4.6" fill="#1C453E" stroke="none"/>
    </g>
    <text x="162" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1D1A">ve-segregation</text>
    <text x="162" y="318" text-anchor="middle" font-size="11.5" fill="#5A544C">which parent it came from</text>

    <!-- ve-frequency : bars, one unmeasured -->
    <g transform="translate(352,248)" fill="none" stroke="#1C453E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-19 16 L-19 1"/>
      <path d="M-7.5 16.5 L-7 -9"/>
      <path d="M4 16 L4.5 -2"/>
      <path d="M-23 20 L20 20.5"/>
      <path d="M15.5 16 L16 5" stroke-width="1.4" stroke-dasharray="3 3.4"/>
      <path d="M12 -3 L19.5 -3" stroke-width="1.4"/>
    </g>
    <text x="352" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1D1A">ve-frequency</text>
    <text x="352" y="318" text-anchor="middle" font-size="11.5" fill="#5A544C">how common is it, really</text>

    <!-- ve-router : the split -->
    <ellipse cx="542" cy="252" rx="30" ry="26" fill="#85FFC4" opacity="0.22"/>
    <g transform="translate(542,248)" fill="none" stroke="#1C453E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-20 4 C -10 4.5, -6 4, -1 3.5"/>
      <path d="M-1 3.5 C 6 3, 9 -10, 19 -11"/>
      <path d="M-1 3.5 C 7 3.5, 11 3, 19 3"/>
      <path d="M-1 3.5 C 6 4, 9 16.5, 19 17"/>
      <circle cx="-1" cy="3.5" r="3.2" fill="#1C453E" stroke="none"/>
    </g>
    <text x="542" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1D1A">ve-router</text>
    <text x="542" y="318" text-anchor="middle" font-size="11.5" fill="#5A544C">picks the one branch that applies</text>

    <!-- ve-lof : protein cut short -->
    <g transform="translate(770,96)" fill="none" stroke="#1C453E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-21 -6 L-21 6.5"/>
      <path d="M-21 0 L-3 0.5"/>
      <path d="M-3 0.5 L1.5 -7.5 L5 8 L8 0.5"/>
      <path d="M11 0.5 L21.5 1" stroke-width="1.4" stroke-dasharray="3 3.2" opacity="0.5"/>
    </g>
    <text x="770" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1D1A">ve-lof</text>
    <text x="770" y="151" text-anchor="middle" font-size="11.5" fill="#5A544C">protein cut short</text>

    <!-- ve-splice : exon join broken -->
    <g transform="translate(770,204)" fill="none" stroke="#1C453E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-22 -6 L-9 -6.5 L-9 6 L-22 6.5 Z"/>
      <path d="M9 -6 L21.5 -6.5 L21.5 6 L9 6.5 Z"/>
      <path d="M-9 0 L9 0"/>
      <path d="M-4.5 -6 L4.5 6"/>
      <path d="M4.5 -6 L-4.5 6"/>
    </g>
    <text x="770" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1D1A">ve-splice</text>
    <text x="770" y="259" text-anchor="middle" font-size="11.5" fill="#5A544C">exon joins disrupted</text>

    <!-- ve-missense : one residue swapped -->
    <g transform="translate(770,312)">
      <path d="M-22 8 L21.5 8.5" fill="none" stroke="#1C453E" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="-16" cy="0" r="4.2" fill="#1C453E"/>
      <circle cx="-4.5" cy="0.3" r="4.2" fill="#1C453E"/>
      <path d="M7.5 -8.5 C 14.5 -8.5, 14.5 3.5, 7.5 3.5 C 0.5 3.5, 0.5 -8.5, 7.5 -8.5 Z" fill="none" stroke="#1C453E" stroke-width="1.7" stroke-linejoin="round"/>
      <circle cx="19" cy="0.2" r="4.2" fill="#1C453E"/>
    </g>
    <text x="770" y="350" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1D1A">ve-missense</text>
    <text x="770" y="367" text-anchor="middle" font-size="11.5" fill="#5A544C">one amino acid swapped</text>

    <!-- ve-regulatory : an accessibility peak -->
    <g transform="translate(770,420)" fill="none" stroke="#1C453E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-22 10 C -14 10.5, -12 9.5, -8 10"/>
      <path d="M-8 10 C -4 10, -3.5 -9, 1.5 -9 C 6.5 -9, 6 10, 10 10"/>
      <path d="M10 10 C 15 10.5, 17 9.5, 21.5 10"/>
      <path d="M-22 14.5 L21.5 15" stroke-width="1.4" stroke-dasharray="2.6 3"/>
    </g>
    <text x="770" y="458" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1D1A">ve-regulatory</text>
    <text x="770" y="475" text-anchor="middle" font-size="11.5" fill="#5A544C">switches, not genes</text>

    <!-- ve-merge : converge into a list -->
    <g transform="translate(988,252)" fill="none" stroke="#1C453E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-18 -13 L0 2 L18 -13.5"/>
      <path d="M0 2 L0.5 10"/>
      <path d="M-11 15 L11 15.5"/>
      <path d="M-7 21 L7 21.5"/>
    </g>
    <text x="988" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1D1A">ve-merge</text>
    <text x="988" y="320" text-anchor="middle" font-size="11.5" fill="#5A544C">what we can and can't say</text>

  </g>
</svg>
